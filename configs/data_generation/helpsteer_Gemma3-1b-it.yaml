experiment:
  run_id: "helpsteer_Gemma3-1b-it"

dataset:
  source: hf               # hf | synthetic
  hf_name: nvidia/HelpSteer2
  hf_split: train
  prompt_field_candidates: [prompt, question, instruction, chosen, text]
  dataset_key: hsteer
  source_tokenizer: OpenAssistant/reward-model-deberta-v3-large-v2 # tokenizer used for filtering prompts by length
  max_prompt_length: 250 # max prompt length + max_new_tokens should be <= model's max input length (512)


models:
  use_chat_template: true
  language_model: google/gemma-3-1b-it
  reward_models:
    # - name: rm_deberta
    #   model_id: OpenAssistant/reward-model-deberta-v3-large-v2
    - name: skywork
      model_id: Skywork/Skywork-Reward-V2-Qwen3-8B
    # - name: armorm
    #   model_id: RLHFlow/ArmoRM-Llama3-8B-v0.1

generation:
  max_new_tokens: 256
  top_p: 0.85
  temperature: 0.7
  k: 10

runtime:
  seed: 13
  device: cuda
  dtype: float16
  load_in_4bit: false
  offline_mode: false
  text_framework: 'vllm'  # hf | vllm
  vllm_tensor_parallel_size: 1
  vllm_gpu_memory_utilization: 0.7
  reward_batch_size: 16
  language_batch_size: 16
  flush_every: 8192
